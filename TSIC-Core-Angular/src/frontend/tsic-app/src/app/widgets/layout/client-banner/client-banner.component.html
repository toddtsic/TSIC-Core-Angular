<div class="client-banner">
    @if (job()) {
    @if (isBannerCustom() && bannerBackgroundUrl()) {
    <!-- Background image with optional banner overlay -->
    <div class="banner-background-only" [style.background-image]="'url(' + bannerBackgroundUrl() + ')'">
        @if (hasValidOverlayImage()) {
        <!-- Overlay banner image on top of background -->
        <div class="banner-image-overlay">
            <img [src]="bannerImageUrl()" [alt]="jobName() + ' Banner'" class="banner-overlay-image"
                (load)="onOverlayImageLoad($event)" (error)="onOverlayImageError($event)" />
        </div>
        }
        <!-- Text overlay on left side -->
        <!-- Banner image is indicated here: only paint explicit banner text, never the jobName fallback -->
        <div class="banner-text-overlay">
            @if (jobBannerText1Decoded()) {
            <h1 class="banner-title" [innerHTML]="jobBannerText1Decoded()"></h1>
            }
            @if (jobBannerText2Decoded()) {
            <p class="banner-subtitle" [innerHTML]="jobBannerText2Decoded()"></p>
            }
        </div>
    </div>
    } @else if (isBannerCustom() && bannerImageUrl()) {
    <!-- Standard banner image if available -->
    <div class="banner-image-container">
        <img [src]="bannerImageUrl()" [alt]="jobName() + ' Banner'" class="banner-image" />
    </div>
    } @else {
    <!-- Text-only banner: the jobName ALONE. Overlay text belongs to the custom banner, so
         neither Text1 nor Text2 may appear here. Text2 used to leak through, which meant a
         job that turned the custom banner off - or a clone that started on a plain banner -
         still showed last season's caption on its public home page. -->
    <div class="banner-text">
        <h1 class="banner-title">{{ jobName() }}</h1>
    </div>
    }
    } @else {
    <!-- Fallback for when no job is loaded -->
    <div class="banner-fallback">
        <h1 class="banner-title">Welcome</h1>
    </div>
    }
</div>

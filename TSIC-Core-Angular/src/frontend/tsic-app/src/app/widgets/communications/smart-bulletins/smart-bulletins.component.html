@if (hasContent()) {
	<div class="sb" aria-label="Smart Bulletins — updated automatically">

		<!-- Live game clock — centered above the lead-in when a game is on. Self-hides
		     on phones via its own media query. -->
		@if (showClock() && jobId()) {
			<div class="sb__clock-row">
				<app-inline-game-clock class="sb__clock" [jobId]="jobId()" />
			</div>
		}

		<div id="sb-panels" class="sb__panels">

			<!-- Financial Health — DIRECTOR ONLY, and FIRST in the band. The only card in
			     here that is NOT part of the public preview, so it carries its own private
			     treatment (inverted surface + lock ribbon + the director's own name). -->
			@if (showFinancialHealth()) {
				<app-financial-health />
			}

			<!-- Event Status — the lifecycle headline for the non-action phases (planned /
			     preview / concluded). Self-hides in the action phases, where Game-Day leads.
			     In the CONCLUDED phase it is the whole story: it carries the final-standings
			     link itself (standingsLink) and the Game-Day panel below stands down, so a
			     finished event renders ONE card instead of two flag-icon cards stacked. -->
			@if (showEventStatus()) {
				<app-event-status [standingsLink]="standingsLink()" />
			}

			<!-- Game-Day — LIVE phases only (Event Status is hidden then, so this leads). -->
			@if (showGameDay()) {
				<app-game-day-panel [jobPath]="jobPath()" />
			}

			@if (showRegistration()) {
				<app-registration-panel [jobPath]="jobPath()" [allowedKeys]="allowedKeys()" [publicView]="publicView()" />
			}

			<!-- USA Lacrosse membership notice — follows the Registration panel: the family
			     sees Register Player first, then the "what you'll need to pass validation"
			     primer. Shows only when the profile requires it (pulse flag). -->
			@if (showUsLax()) {
				<app-uslax-info />
			}

			<!-- Store rides in the band on its own. (Public Rosters now lives as a section
			     INSIDE the Registration panel above, not as a standalone card here.) -->
			@if (showStore()) {
				<div class="sb__card-wrap">
					<a class="sb__card" [routerLink]="storeLink()">
						<span class="sb__card-icon" aria-hidden="true"><i class="bi bi-bag"></i></span>
						<span class="sb__card-text">
							<strong>Team Store</strong>
							<small>Official gear &amp; merchandise</small>
						</span>
						<i class="bi bi-arrow-right sb__card-go" aria-hidden="true"></i>
					</a>
				</div>
			}

		</div>

	</div>
}

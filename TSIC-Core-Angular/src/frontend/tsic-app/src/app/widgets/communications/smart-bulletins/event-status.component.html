@if (view(); as v) {
	<section class="es" aria-label="Event status">
		<div class="es__inner">
			<span class="es__icon" aria-hidden="true"><i class="bi {{ v.icon }}"></i></span>
			<div class="es__text">
				<h3 class="es__headline">{{ v.headline }}</h3>
				<p class="es__sub">{{ v.sub }}</p>

				<!-- Concluded-only action: the final-standings link, absorbed from the Game-Day
				     panel so a finished event renders ONE card. Absent when the event has no
				     public schedule to link to (the band passes null). -->
				@if (v.cta; as cta) {
					<a class="es__cta" [routerLink]="cta.link" [queryParams]="cta.queryParams ?? null">
						<i class="bi bi-calendar-event" aria-hidden="true"></i>
						<span>{{ cta.label }}</span>
						<i class="bi bi-arrow-right es__cta-go" aria-hidden="true"></i>
					</a>
				}
			</div>
		</div>
	</section>
}

<!-- ORDER (Todd, 2026-09-25): the ORGANIZER SPEAKS FIRST. Their hand-authored
     bulletins lead the page; the ✨ SMART band — self-assembling, always-current,
     standing infrastructure — follows below. It is their site, and today's news
     outranks the furniture. The two are never interleaved.

     Known and accepted: registration CTAs live inside the band, so on a job that
     runs a lot of bulletins they now sit below them. The answer to that is
     bulletin hygiene (the admin hide control on each one), NOT another re-order. -->
@if (bulletins() && bulletins().length > 0) {
<div class="bulletins-sep">
    <span class="bulletins-sep__label"><i class="bi bi-megaphone-fill" aria-hidden="true"></i> News &amp; Updates</span>
</div>
<div class="bulletins">
    @for (bulletin of bulletins(); track bulletin.bulletinId) {
    <article class="bulletin">
        @if (isAdmin()) {
        <div class="bulletin-admin-actions">
            <button type="button" class="bulletin-admin-btn"
                    (click)="edit(bulletin, $event)"
                    title="Edit this bulletin"
                    aria-label="Edit this bulletin">
                <i class="bi bi-pencil" aria-hidden="true"></i>
            </button>
            <button type="button" class="bulletin-admin-btn bulletin-admin-btn--hide"
                    (click)="deactivate(bulletin, $event)"
                    [disabled]="deactivatingId() === bulletin.bulletinId"
                    title="Hide this bulletin (set inactive)"
                    aria-label="Hide this bulletin">
                <i class="bi bi-eye-slash" aria-hidden="true"></i>
            </button>
        </div>
        }
        <div class="bulletin-content">
            @if (bulletin.title) {
            <h2 class="bulletin-title">{{ bulletin.title }}</h2>
            }

            <div class="bulletin-body" appInternalLink [jobPath]="jobPath()">
                <div [innerHTML]="bulletin.text | translateLegacyUrls:jobPath() | richText"></div>
            </div>
        </div>
    </article>
    }
</div>
}

<!-- No divider introduces the band, deliberately. `smart()` is a host opt-in, NOT a
     has-content signal — the band decides for itself whether to render (its own
     hasContent gate), so a header placed here would sometimes introduce nothing at
     all. Reading that gate means touching smart-bulletin code, which is off limits.
     The band's cards carry their own surface, so the boundary still reads. -->
@if (smart()) {
<app-smart-bulletins [jobPath]="jobPath()" />
}

@if (loading()) {
<div class="bulletins-loading">
    <div class="spinner"></div>
    <p>Loading bulletins...</p>
</div>
}

@if (error()) {
<div class="bulletins-error">
    <p class="error-message">{{ error() }}</p>
</div>
}

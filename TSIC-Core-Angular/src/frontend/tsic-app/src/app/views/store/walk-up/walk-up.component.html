@if (ready()) {
<div class="wu-shell">
	<div class="wu-card">

		<!-- Masthead -->
		<div class="wu-masthead">
			<span class="wu-badge"><i class="bi bi-shop" aria-hidden="true"></i></span>
			<h1 class="wu-title">Welcome to the Store</h1>
			<p class="wu-subtitle">Just a few quick details and you're in &mdash; shopping takes less than a minute.</p>
		</div>

		<div class="wu-body">
			@if (errorMessage(); as err) {
				<div class="wu-alert" role="alert">
					<i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
					<span>{{ err }}</span>
				</div>
			}

			<form class="wu-form" (ngSubmit)="submit()" #walkUpForm="ngForm">

				<!-- Name -->
				<div class="wu-row wu-row--halves">
					<div class="wu-field">
						<label for="firstName" class="wu-label">First Name</label>
						<input id="firstName" type="text" class="wu-input"
							   [ngModel]="firstName()" (ngModelChange)="firstName.set($event)"
							   name="firstName" required autocomplete="given-name">
					</div>
					<div class="wu-field">
						<label for="lastName" class="wu-label">Last Name</label>
						<input id="lastName" type="text" class="wu-input"
							   [ngModel]="lastName()" (ngModelChange)="lastName.set($event)"
							   name="lastName" required autocomplete="family-name">
					</div>
				</div>

				<!-- Email -->
				<div class="wu-field">
					<label for="email" class="wu-label">Email</label>
					<input id="email" type="email" class="wu-input"
						   [ngModel]="email()" (ngModelChange)="email.set($event)"
						   name="email" required autocomplete="email"
						   placeholder="you@example.com"
						   [class.is-invalid]="emailError()"
						   [attr.aria-invalid]="emailError() ? 'true' : null"
						   [attr.aria-describedby]="emailError() ? 'emailError' : null">
					@if (emailError(); as err) {
						<p id="emailError" class="wu-error"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ err }}</p>
					}
				</div>

				<!-- Phone -->
				<div class="wu-field">
					<label for="phone" class="wu-label">Phone</label>
					<input id="phone" type="tel" class="wu-input"
						   [ngModel]="phone()" (ngModelChange)="phone.set($event)"
						   name="phone" required autocomplete="tel"
						   inputmode="numeric" maxlength="10" placeholder="10 digits, no spaces"
						   [class.is-invalid]="phoneError()"
						   [attr.aria-invalid]="phoneError() ? 'true' : null"
						   [attr.aria-describedby]="phoneError() ? 'phoneError' : null">
					@if (phoneError(); as err) {
						<p id="phoneError" class="wu-error"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ err }}</p>
					}
				</div>

				<!-- Street Address -->
				<div class="wu-field">
					<label for="streetAddress" class="wu-label">Street Address</label>
					<input id="streetAddress" type="text" class="wu-input"
						   [ngModel]="streetAddress()" (ngModelChange)="streetAddress.set($event)"
						   name="streetAddress" required autocomplete="street-address">
				</div>

				<!-- City -->
				<div class="wu-field">
					<label for="city" class="wu-label">City</label>
					<input id="city" type="text" class="wu-input"
						   [ngModel]="city()" (ngModelChange)="city.set($event)"
						   name="city" required autocomplete="address-level2">
				</div>

				<!--
					State and ZIP share a row. State is NOT on an auto/fr track: a select
					contributes the width of its widest option ("District of Columbia"),
					which collapses whatever shares the row with it.
				-->
				<div class="wu-row wu-row--state-zip">
					<div class="wu-field">
						<label for="state" class="wu-label">State</label>
						<div class="wu-select-wrap">
							<select id="state" class="wu-input wu-select"
									[ngModel]="state()" (ngModelChange)="state.set($event)"
									name="state" required autocomplete="address-level1">
								<option value="">Select a state</option>
								@for (s of states; track s.value) {
									<option [value]="s.value">{{ s.label }}</option>
								}
							</select>
							<i class="bi bi-chevron-down wu-select-caret" aria-hidden="true"></i>
						</div>
					</div>
					<div class="wu-field">
						<label for="zip" class="wu-label">ZIP</label>
						<input id="zip" type="text" class="wu-input"
							   [ngModel]="zip()" (ngModelChange)="zip.set($event)"
							   name="zip" required autocomplete="postal-code"
							   inputmode="numeric" maxlength="10" placeholder="12345"
							   [class.is-invalid]="zipError()"
							   [attr.aria-invalid]="zipError() ? 'true' : null"
							   [attr.aria-describedby]="zipError() ? 'zipError' : null">
						@if (zipError(); as err) {
							<p id="zipError" class="wu-error"><i class="bi bi-exclamation-circle" aria-hidden="true"></i>{{ err }}</p>
						}
					</div>
				</div>

				<button type="submit" class="wu-submit" [disabled]="!isValid || isLoading()">
					@if (isLoading()) {
						<span class="wu-spinner" aria-hidden="true"></span>Registering&hellip;
					} @else {
						<i class="bi bi-arrow-right-circle" aria-hidden="true"></i>Let's Go
					}
				</button>
			</form>
		</div>
	</div>
</div>
}

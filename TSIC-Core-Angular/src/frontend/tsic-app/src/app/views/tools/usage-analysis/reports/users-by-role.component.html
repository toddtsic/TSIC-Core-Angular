<app-usage-pivot-report
	[isLoading]="fetch.isLoading()"
	[error]="fetch.error()"
	[isEmpty]="isEmpty()"
	loadingMessage="Counting users…"
	emptyMessage="No signed-in users in this window."
	[tiles]="tiles()"
	[columns]="columns()"
	[rows]="rows()"
	[allRow]="allRow()"
	[chartRow]="chartRow()"
	[chartSubtitle]="chartSubtitle()"
	[chartSeries]="chartSeries()"
	[primaryXAxis]="primaryXAxis()"
	[primaryYAxis]="primaryYAxis()"
	[legendSettings]="legendSettings"
	[tooltip]="tooltip"
	chartEmptyMessage="No signed-in users in the window."
	lensEmptyMessage="No signed-in users of this event in the window. Pick another event above, or a row below.">
	A user is a registration that made at least one request about the event in the window. Someone
	holding two roles counts once under each. Public visitors who never sign in are not people this
	data can count; what they asked for is report 02.
</app-usage-pivot-report>

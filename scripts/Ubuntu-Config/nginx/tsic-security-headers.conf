# Security headers for the TSIC app site, the same set IIS sent from
# web.config.angular. Installed to /etc/nginx/snippets/ and included by
# tsic-app.conf.template.
#
# HSTS is deliberately not here. It binds a whole host name, not one port, so on a
# lab machine reached as "localhost" it would force HTTPS onto every other
# forwarded port. Add it for a real host name together with its real certificate.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
